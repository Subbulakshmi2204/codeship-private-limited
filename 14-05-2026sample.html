<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XCROS Clone</title>
    
    <!-- Google Fonts: Montserrat for the modern bold look -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
          
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color:rgb(224,242,241);
            min-height: 100vh;
        }

        .navbar {
            background-color: teal;
            padding: 5px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo img {
    height: 40px; 
}

        .nav-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

        .btn-signin {
           background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.7);
            color: white;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
.menu-toggle {
    background-color:DarkOrange ;
    width: 35px;
    height: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    cursor: pointer;
    color:white;
}
.hero-section {
    height: 72vh;
    padding: 50px 10px;
    background-image:  linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)),url('https://static.vecteezy.com/system/resources/previews/009/189/635/non_2x/winter-park-scenery-with-happy-family-in-santa-hats-walking-city-silhouette-christmas-tree-bench-snowy-trees-flat-illustration-vector.jpg');
    background-size: cover;
}
.search-container {
    background-color: teal;
    width: 360px;
    padding: 20px;
    border-radius: 15px;
    height:212px;
}
.tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
.tab {
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}
.input-group {
    position: relative;
    margin-bottom: 20px;
}

.input-group input {
    width: 80%;
    padding: 10px 10px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    color: gray;
}

.select-icon {
    position: absolute;
    right: 100px;
    top: 13px;
    color: gray;
}

.explore-btn {
    background-color: darkorange;
    color: white;
    border: none;
    width: 60%;
    padding: 3px 15px;
    border-radius: 25px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    text-align: center;
}

.tagline {
    color: white;
    font-size: 14px;
    font-weight: bold;
}
@media (max-width:768px){

    .search-container{
        width: 90%;
    }

    .input-group input,
    .explore-btn{
        width: 90%;
    }

    .select-icon{
        right: 15px;
    }
}

@media (max-width:480px){

    .tab-buttons{
        flex-direction: column;
    }

    .tab{
        width: 100%;
    }
}
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="https://xcros.in/image/Preloader%20Logo.png" alt="XCROS Logo">
        </div>
        <div class="nav-actions">
            <button class="btn-signin">
                <i class="bi bi-person"></i> Sign In <i class="bi bi-chevron-right" style="font-size: 10px;"></i>
            </button>
             <div class="menu-toggle"><i class="bi bi-list" style="font-size: 24px;"></i></div>
        </div>
    </header>

    <main class="hero-section">
        <div class="search-container">
            <div class="tab-buttons">
                <button class="tab" style="background-color:darkorange; color:white; "><i class="bi-geo-alt-fill"></i> By Pincode</button>
                <button class="tab"><i class="bi-geo-alt-fill"></i> By City</button>
            </div>
            
            <div class="input-group">
                <input type="text" placeholder="Enter Pincode">
                <i class="bi bi-chevron-down select-icon"></i>
            </div>

            <button class="explore-btn">Explore Location<i class="bi bi-arrow-right" style="padding:10px ;"></i></button>
            
            <p class="tagline">Explore your location with XCROS</p>
        </div>

      
    </main>

</body>
</html>
