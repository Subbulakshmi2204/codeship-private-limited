<!DOCTYPE html>
<html lang="en">
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Animal Match Game</title>
    <style>
        body
        {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-color: antiquewhite;
            padding: 30px;
        }
        .game-box
        {
            background-color: whitesmoke;
            width: 70%;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 0px 15px gray;
            align-items: center;
        }
        h1
        {
            color: darkblue;
        }
        .container
        {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        button
        {
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 10px;
            background-color: teal;
            color:aliceblue;
            cursor: pointer;
        }
        .result
        {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
            color: darkred;
        }
    </style>
    </head>
    <body>
        <div class="game-box">
        <h1>Animal Matching</h1>
        <p>Select an Animal </p>
        <div class="container" id="animalContainer"></div>
        <div class="result" id="result"></div>
        </div>
        <script>
                const animals=['Lion','Tiger','Elephant','Monkey','Zebra','Panda','Monkey','Rabbit'];
                
                const container = document.getElementById("animalContainer");
                const result = document.getElementById("result");

                animals.forEach((animal) => 
                {
                    let btn = document.createElement("button");
                    btn.innerText = animal;

                    btn.onclick = function()
                    {
                        let randomIndex = Math.floor(Math.random() *animals.length);
                        let computeranimal = animals[randomIndex];

                        if(animal === computeranimal)
                    {
                        result.innerHTML = "You selected: "+ animal +
                        "<br>Computer Selected: "+computeranimal +
                        "<br><br>✅Matched";
                    }
                    else
                    {
                        result.innerHTML = "You selected: "+ animal +
                        "<br>Computer Selected: "+computeranimal + 
                        "<br><br>❌Failed";
                    }
                    };
                        container.appendChild(btn);
                });

        </script>
    </body>
</html>
