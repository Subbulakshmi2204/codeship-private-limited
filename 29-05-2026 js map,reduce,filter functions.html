<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Performance Dashboard</title>

  <style>

    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#fdfbfb,#ebedee);
  padding:40px 20px;
  color:#2d3748;
}


/* MAIN TITLE */

.title{
  text-align:center;
  font-size:42px;
  font-weight:700;
  color:#3b4252;
  margin-bottom:10px;
  letter-spacing:1px;
}

.subtitle{
  text-align:center;
  font-size:18px;
  color:#718096;
  margin-bottom:40px;
}


/* CONTAINER */

.container{
  width:95%;
  max-width:1200px;
  margin:auto;
}


/* CARD DESIGN */

.card{
  background:rgba(255,255,255,0.7);
  border:1px solid rgba(255,255,255,0.4);
  backdrop-filter:blur(12px);
  border-radius:24px;
  padding:35px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}


/* SECTION TITLE */

.section-title{
  font-size:28px;
  color:#4a5568;
  margin-bottom:20px;
}


/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:18px;
}


/* TABLE HEADER */

table th{
  background:linear-gradient(135deg,#89f7fe,#66a6ff);
  color:white;
  padding:16px;
  font-size:15px;
  letter-spacing:1px;
  text-transform:uppercase;
}


/* TABLE BODY */

table td{
  padding:16px;
  text-align:center;
  background:#ffffff;
  border-bottom:1px solid #edf2f7;
  color:#4a5568;
  transition:0.3s;
}


/* HOVER EFFECT */

table tr:hover td{
  background:#f7fafc;
}


/* PASS FAIL COLORS */

.pass{
  color:#38a169;
  font-weight:bold;
}

.fail{
  color:#e53e3e;
  font-weight:bold;
}


/* GRADE */

.grade{
  color:#805ad5;
  font-weight:700;
}


/* SUMMARY BOX */

.summary-box{
  display:flex;
  gap:20px;
  margin-top:35px;
  flex-wrap:wrap;
}


/* SUMMARY CARDS */

.summary-card{
  flex:1;
  min-width:220px;
  background:linear-gradient(135deg,#ffffff,#f8fafc);
  border-radius:20px;
  padding:25px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.06);
  transition:0.3s;
}

.summary-card:hover{
  transform:translateY(-5px);
}


/* SUMMARY TEXT */

.summary-card h3{
  color:#718096;
  margin-bottom:12px;
  font-size:20px;
}

.summary-card p{
  font-size:32px;
  font-weight:bold;
  color:#5a67d8;
}

  </style>

</head>

<body>

  <h1 class="title">Student Performance Dashboard</h1>

  <p class="subtitle">
    Academic Results and Performance Overview
  </p>

  <div class="container">

    <div class="card">

      <h2 class="section-title">Student Results</h2>

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Student Name</th>
            <th>Department</th>
            <th>Marks</th>
            <th>Result</th>
            <th>Grade</th>
          </tr>

        </thead>

        <tbody id="studentTable"></tbody>

      </table>

      <div class="summary-box">

        <div class="summary-card">
          <h3>Total Students</h3>
          <p id="totalStudents"></p>
        </div>

        <div class="summary-card">
          <h3>Passed Students</h3>
          <p id="passedStudents"></p>
        </div>

        <div class="summary-card">
          <h3>Average Marks</h3>
          <p id="averageMarks"></p>
        </div>

      </div>

    </div>

  </div>


  <script>

    let students = [

      {
        id:101,
        name:"Aarav",
        department:"CSE",
        marks:92
      },

      {
        id:102,
        name:"Meera",
        department:"IT",
        marks:47
      },

      {
        id:103,
        name:"Rahul",
        department:"ECE",
        marks:78
      },

      {
        id:104,
        name:"Sneha",
        department:"EEE",
        marks:65
      },

      {
        id:105,
        name:"Vikram",
        department:"AI & DS",
        marks:35
      }

    ];



    // FILTER PASSED STUDENTS

    let passedStudents = students.filter(function(student){

      return student.marks >= 50;

    });



    // MAP STATUS & GRADE

    let updatedStudents = students.map(function(student){

      let grade = "";

      if(student.marks >= 90){
        grade = "A+";
      }

      else if(student.marks >= 75){
        grade = "A";
      }

      else if(student.marks >= 60){
        grade = "B";
      }

      else if(student.marks >= 50){
        grade = "C";
      }

      else{
        grade = "Fail";
      }

      return{

        id:student.id,
        name:student.name,
        department:student.department,
        marks:student.marks,
        status:student.marks >= 50 ? "Pass" : "Fail",
        grade:grade

      };

    });



    // REDUCE TOTAL MARKS

    let totalMarks = updatedStudents.reduce(function(total,student){

      return total + student.marks;

    },0);


    let average = totalMarks / updatedStudents.length;



    // DISPLAY TABLE

    let table = document.getElementById("studentTable");


    updatedStudents.forEach(function(student){

      table.innerHTML += `

        <tr>

          <td>${student.id}</td>

          <td>${student.name}</td>

          <td>${student.department}</td>

          <td>${student.marks}</td>

          <td class="${student.status === 'Pass' ? 'pass' : 'fail'}">
            ${student.status}
          </td>

          <td class="grade">${student.grade}</td>

        </tr>

      `;

    });



    // SUMMARY

    document.getElementById("totalStudents").innerHTML = students.length;

    document.getElementById("passedStudents").innerHTML = passedStudents.length;

    document.getElementById("averageMarks").innerHTML = average.toFixed(2);

  </script>

</body>
</html>
